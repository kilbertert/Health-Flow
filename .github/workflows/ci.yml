name: CI

# The project's own deterministic checks, on every pull request and on every
# merge to main. Until this workflow existed the only required check was
# `Workflow policy` — the scaffold's self-check (map freshness, workflow
# boundaries, sandbox network) — so no workflow in this repository had ever run
# pytest or ruff, and a commit that reddened the whole suite could merge with
# zero signal at the PR stage. `consensus-contract.json` lists
# `deterministic-ci` as a non-exceptionable invariant; this is that check.
#
# Why this runs on the repository's own runner, and what that costs.
#
# The original reasoning here was "GitHub-hosted, because the repository is
# PUBLIC so minutes cost nothing, and a persistent runner must never execute
# untrusted pull-request code". That was right when it was written, and it is no
# longer the shape of the decision — see ADR-0010 for the whole account. In
# short: GitHub locked the account for billing, every `ubuntu-latest` job failed
# to start, the Ruleset requires `Tests` and `Workflow policy` to reach a
# conclusion, and so **every PR in this repository became unmergeable**.
#
# The runner is now `[self-hosted, health-flow]`. Read ADR-0010 before changing
# it: the trade is real and it is recorded there rather than argued here. The
# short version of the cost, because a reader of this file needs it: a
# persistent runner is a machine with real credentials on it, so anything that
# executes here must be treated as trusted code. The mitigation is the fork gate
# in repository settings (`all_external_contributors`), not anything in this
# file — a workflow cannot enforce its own preconditions.
#
# Job-level `concurrency` (not workflow-level), and the reason is a measured
# failure mode rather than a preference — see .github/workflows/cd.yml for the
# four-round account of workflow-level locks deadlocking a queued run.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # This job's `name` is the required-status-check context. Adding it to the
    # Ruleset is a separate, ordered step: it can only be added after it has run
    # green at least once on main. A required check that has never reported stays
    # pending forever and blocks every pull request — so this file must land
    # first, and the Ruleset edit follows the first green run on main.
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      # `--extra dev`, not `--dev`. The test dependencies (pytest, ruff) live in
      # `[project.optional-dependencies] dev`, so `uv sync --locked --dev`
      # installs nothing and still exits 0. What happens next is the trap:
      # `uv run pytest` finds no pytest in the venv and falls back to whatever
      # pytest is on PATH, which produces `ModuleNotFoundError: No module named
      # 'app'` across the suite — an environment fault that reads exactly like
      # broken code. Measured on a clean clone of e2db15c.
      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run static checks
        run: uv run ruff check .

      # Deliberately NOT `ruff format --check`: 27 files on main would be
      # reformatted, and adopting a formatter is its own change with its own
      # diff. Mixing it into the commit that introduces the test gate would make
      # the gate's first run unreadable.

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      # Order matters: three contract tests drive the real frontend modules
      # through esbuild and `@pytest.mark.skipif` themselves out when
      # `frontend/node_modules` is absent. Without `npm ci` above, "all green"
      # arrives as `445 passed, 4 skipped` — a skip count read as a pass, the
      # same failure shape as a skipped required job counting as success.
      #
      # `-rs` prints why each skip happened. This log is the artifact a reviewer
      # actually reads, and a bare count cannot answer "were those the three
      # frontend contract tests, or something that silently regressed into
      # skipping?" — the question this whole step exists to keep answerable.
      - name: Run tests
        run: uv run pytest -q -rs

      # ── The browser suite ──────────────────────────────────────────────────
      # 81 specs that drive the REAL frontend against a REAL server, with a
      # throwaway SQLite database under TMPDIR and a fixture backend — the config
      # in `frontend/playwright.config.js` never touches `data/healthflow.db`.
      #
      # WHY THIS IS IN CI, after it ran nowhere for as long as it existed. These
      # are the only automated assertions in this repository about what a patient
      # sees: colour, wording, which page a coordinate lands on. Every other test
      # here is Python, and can only prove the API said the right thing. A green
      # `pytest` run is compatible with a frontend that renders "failed" in the
      # same colour as "passed" — measured, that exact spec exists because it
      # happened.
      #
      # The cost is small BECAUSE of the two steps above: the suite reuses the
      # `npm ci` and `npm run build` CI already performs, so what it adds is the
      # chromium download and ~55 s of execution. Measured on a dev box
      # 2026-10-23: 81 passed in 55.7 s and again in 54.0 s, twice in a row.
      #
      # ⚠️ A separate step, not folded into the pytest one. When it fails, the
      # reviewer needs to know whether the API contract or the rendered page
      # broke — one combined red gives neither.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      # The report is the artifact a reviewer reads when the step above goes red;
      # without it, a failure is only a list of test names. `if: always()` because
      # the interesting case is exactly the failing one.
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
